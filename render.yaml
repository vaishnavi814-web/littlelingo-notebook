# Render Blueprint for the littlelingo app + backend.
# One service serves both the React UI (copied from english-notebook/client/dist)
# and the Express API. Data lives in MongoDB Atlas, so no disk is required.
services:
  - type: web
    name: littlelingo-api
    runtime: node
    plan: free
    buildCommand: |
      npm --prefix english-notebook/client ci
      npm --prefix english-notebook/client run build
      npm --prefix english-notebook/server ci
      mkdir -p english-notebook/server/public
      cp -r english-notebook/client/dist/. english-notebook/server/public/
    startCommand: node english-notebook/server/index.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Atlas connection string. Set this in the Render dashboard (Environment).
      - key: MONGO_URI
        sync: false
      # Fail loudly if Atlas is unreachable instead of falling back to ephemeral SQLite.
      - key: REQUIRE_MONGO
        value: "true"
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      # Point this at an Ollama instance reachable from Render.
      # 127.0.0.1 will NOT work here — there is no Ollama inside the container.
      - key: OLLAMA_URL
        sync: false
      # Frontend origin allowed to call this API (the Vercel site).
      - key: ALLOWED_ORIGIN
        value: https://littlelingo-alpha.vercel.app
