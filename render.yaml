# Render Blueprint for the littlelingo backend (optional).
# The web app itself is deployed to Vercel from english-notebook/client.
services:
  - type: web
    name: littlelingo-api
    runtime: node
    rootDir: english-notebook/server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    disk:
      name: littlelingo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      # Point this at an Ollama instance reachable from Render.
      # 127.0.0.1 will NOT work here — there is no Ollama inside the container.
      - key: OLLAMA_URL
        sync: false
