# Render Blueprint for the littlelingo app + backend.
# One web service serves the Express API (/api/*). Data lives in MongoDB Atlas,
# so no disk is required. The React UI is deployed separately on Vercel and
# calls this service cross-origin (see ALLOWED_ORIGIN below).

services:
  - type: web
    name: littlelingo-api
    runtime: node
    plan: free
    rootDir: english-notebook/server
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      # Atlas connection string. Set this in the Render dashboard (Environment).
      - key: MONGO_URI
        sync: false
      # Fail loudly if Atlas is unreachable instead of falling back to ephemeral SQLite.
      - key: REQUIRE_MONGO
        value: "true"
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      # Point this at an Ollama instance reachable from Render.
      # 127.0.0.1 will NOT work here — there is no Ollama inside the container.
      - key: OLLAMA_URL
        sync: false
      # Frontend origin allowed to call this API (the Vercel site).
      - key: ALLOWED_ORIGIN
        value: https://littlelingo-alpha.vercel.app
